version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dropzone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: limited_drop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dropzone-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dropzone-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@postgres:5432/limited_drop
      JWT_SECRET: dev-secret-key-do-not-use-in-production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
      RESERVATION_EXPIRATION_MINUTES: 5
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    networks:
      - dropzone-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dropzone-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dropzone-network
    restart: unless-stopped

networks:
  dropzone-network:
    driver: bridge

volumes:
  postgres_data: