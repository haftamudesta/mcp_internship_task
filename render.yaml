services:
  # Backend API Service
  - type: web
    name: dropzone-backend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://dropzone-frontend.onrender.com
      - key: RESERVATION_EXPIRATION_MINUTES
        value: 5
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100

  # Frontend Static Site
  - type: web
    name: dropzone-frontend
    runtime: static
    region: oregon
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      - key: VITE_API_URL
        value: https://dropzone-backend.onrender.com